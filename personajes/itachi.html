<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Itachi</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider/carrusel -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* 🔴 Fondo acorde a Itachi (oscuridad + Sharingan) */
    body{
      background:
        radial-gradient(circle at 30% 20%, rgba(180, 0, 0, 0.45) 0%, rgba(180, 0, 0, 0) 45%),
        radial-gradient(circle at 70% 30%, rgba(120, 0, 0, 0.35) 0%, rgba(120, 0, 0, 0) 50%),
        radial-gradient(circle at 50% 85%, rgba(255, 60, 60, 0.15) 0%, rgba(255, 60, 60, 0) 55%),
        linear-gradient(135deg, #090000, #1a0000, #000000);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;

      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 700;
      text-align: center;
      font-size: 1.4rem;
      padding: 0;
      background: transparent;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/itachi/itachi.jfif"
        alt="Itachi Uchiha"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Itachi Uchiha</h2>
          <p class="card__description">
            Shinobi prodigioso del clan Uchiha, conocido por su inteligencia, serenidad y sacrificio.
            Portador de un destino trágico, Itachi eligió cargar con el odio del mundo para proteger aquello que amaba.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">

      <!-- BOTONES -->
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <!-- CONTENEDOR DE IMÁGENES -->
      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/itachi/itachi1.png"
          class="fade show"
          alt="Itachi artwork"
        >
      </div>

      <!-- DUEÑO -->
      <div id="dueños-container">Emilio Contreras</div>

    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesItachi = [
      { src: "imagenes/itachi/itachi1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/itachi/itachi2.png", dueño: "María Pérez" },
      { src: "imagenes/itachi/itachi3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/itachi/itachi4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesItachi[index].src;
          dueñoContainer.textContent = imagenesItachi[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>
</body>
</html>
