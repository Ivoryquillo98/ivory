<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Gon</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider/carrusel -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ✅ Fondo acorde a Gon (verde, naturaleza, energía juvenil) */
    body{
      background:
        radial-gradient(circle at 20% 20%, rgba(80, 255, 160, 0.55) 0%, rgba(80, 255, 160, 0) 45%),
        radial-gradient(circle at 75% 25%, rgba(120, 255, 120, 0.45) 0%, rgba(120, 255, 120, 0) 50%),
        radial-gradient(circle at 50% 85%, rgba(255, 255, 180, 0.25) 0%, rgba(255, 255, 180, 0) 55%),
        linear-gradient(135deg, #0b2e1b, #114a2d, #071a10);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;

      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 700;
      text-align: center;
      font-size: 1.4rem;
      padding: 0;
      background: transparent;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Tarjeta del personaje -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/gon/gon.png"
        alt="Gon Freecss"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Gon Freecss</h2>
          <p class="card__description">
            Aventurero, valiente y de espíritu puro, Gon busca convertirse en Cazador para encontrar a su padre.
            Su energía y determinación lo convierten en el corazón de Hunter x Hunter.
          </p>
        </div>
      </div>
    </article>

    <!-- Slider de imágenes -->
    <div class="slider">

      <!-- Botones -->
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <!-- Contenedor de imágenes -->
      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/gon/gon1.png"
          class="fade show"
          alt="Gon artwork"
        >
      </div>

      <!-- Dueño -->
      <div id="dueños-container">Emilio Contreras</div>
    </div>

  </div>

  <!-- JS del slider -->
  <script>
    const imagenesGon = [
      { src: "imagenes/gon/gon1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/gon/gon2.png", dueño: "María Pérez" },
      { src: "imagenes/gon/gon3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/gon/gon4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesGon[index].src;
          dueñoContainer.textContent = imagenesGon[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>
</body>
</html>
