<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Naruto</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider/carrusel -->
  <link rel="stylesheet" href="css/carrusel.css">
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* Fondo inspirado en Naruto */
    body {
      background: 
        linear-gradient(to bottom, #FF9900, #FF4500),  /* Colores cálidos, naranja y rojo como la aldea de Konoha */
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.7) 30%, transparent 90%);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 700;
      text-align: center;
      font-size: 1.4rem;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/naruto/naruto.png"
        alt="Naruto"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Naruto Uzumaki</h2>
          <p class="card__description">
            Un joven ninja con un espíritu indomable y el sueño de convertirse en Hokage.  
            Naruto es símbolo de perseverancia, amistad y esperanza, capaz de inspirar a todos los que lo rodean.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/naruto/naruto1.png"
          class="fade show"
          alt="Naruto artwork"
        >
      </div>

      <div id="dueños-container">Emilio Contreras</div>
    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesNaruto = [
      { src: "imagenes/naruto/naruto1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/naruto/naruto2.png", dueño: "María Pérez" },
      { src: "imagenes/naruto/naruto3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/naruto/naruto4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesNaruto[index].src;
          dueñoContainer.textContent = imagenesNaruto[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>
</body>
</html>
