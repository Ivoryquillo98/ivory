<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Trunks</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* 💜⚡ FONDO TRUNKS (violeta/azul frío + energía) */
    body {
      background: radial-gradient(
        circle at top,
        #a86bff 0%,
        #2b1a4a 45%,
        #08060f 100%
      );
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* ✅ MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 600;
      text-align: center;
      font-size: 1.4rem;
      color: #f3eeff;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/trunks/trunks.png"
        alt="Trunks"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Trunks</h2>
          <p class="card__description">
            Hijo de Vegeta y Bulma, Trunks proviene de un futuro devastado.
            Valiente y decidido, viaja en el tiempo para cambiar el destino,
            portando su icónica espada y una voluntad inquebrantable.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">

      <!-- BOTONES -->
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <!-- CONTENEDOR DE IMÁGENES -->
      <div class="slides" id="slides">

        <!-- IMAGEN ACTIVA -->
        <img
          id="sliderImage"
          src="imagenes/trunks/trunks1.png"
          class="fade show"
          alt="Trunks artwork"
        >
      </div>

      <!-- DUEÑO -->
      <div id="dueños-container">Emilio Contreras</div>

    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesTrunks = [
      { src: "imagenes/trunks/trunks1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/trunks/trunks2.png", dueño: "María Pérez" },
      { src: "imagenes/trunks/trunks3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/trunks/trunks4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesTrunks[index].src;
          dueñoContainer.textContent = imagenesTrunks[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>

</body>
</html>
