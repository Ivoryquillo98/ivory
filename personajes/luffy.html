<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Luffy</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider/carrusel -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* 🏴‍☠️ Fondo Luffy: cielo + mar + dorado (tesoro) + rojo */
    body{
      background:
        radial-gradient(circle at 25% 18%, rgba(255, 220, 120, 0.35) 0%, rgba(255, 220, 120, 0) 45%),
        radial-gradient(circle at 80% 22%, rgba(255, 80, 80, 0.25) 0%, rgba(255, 80, 80, 0) 50%),
        radial-gradient(circle at 50% 85%, rgba(120, 200, 255, 0.20) 0%, rgba(120, 200, 255, 0) 55%),
        linear-gradient(135deg, #0a1a2a, #0b3a5a, #06111d);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 700;
      text-align: center;
      font-size: 1.4rem;
      color: #ffffff;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/luffy/luffy.png"
        alt="Luffy"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Monkey D. Luffy</h2>
          <p class="card__description">
            Capitán de los Sombrero de Paja, Luffy es alegre, incansable y decidido a convertirse en el Rey de los Piratas.
            Con un gran sentido de la justicia y la amistad, su determinación inspira a toda su tripulación.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/luffy/luffy1.png"
          class="fade show"
          alt="Luffy artwork"
        >
      </div>

      <div id="dueños-container">Emilio Contreras</div>
    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesLuffy = [
      { src: "imagenes/luffy/luffy1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/luffy/luffy2.png", dueño: "María Pérez" },
      { src: "imagenes/luffy/luffy3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/luffy/luffy4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesLuffy[index].src;
          dueñoContainer.textContent = imagenesLuffy[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>
</body>
</html>
