<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Shizuku</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* 🩵🟣 FONDO SHIZUKU (frío, suave, “calma letal”) */
    body {
      background: radial-gradient(
        circle at top,
        #7a7df0 0%,
        #3a2b66 45%,
        #0b0814 100%
      );
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* ✅ MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 600;
      text-align: center;
      font-size: 1.4rem;
      color: #f2f2ff;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img class="card__background" src="imagenes/shizuku/shizuku.png" alt="Shizuku" />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Shizuku</h2>
          <p class="card__description">
            Miembro del Genei Ryodan, Shizuku combina una actitud despreocupada con un poder letal.
            Su aspiradora demoníaca “Blinky” es su fiel aliada en combate, reflejando su calma y precisión.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">

      <!-- BOTONES -->
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <!-- CONTENEDOR DE IMÁGENES -->
      <div class="slides" id="slides">

        <!-- IMAGEN ACTIVA -->
        <img
          id="sliderImage"
          src="imagenes/shizuku/shizuku1.png"
          class="fade show"
          alt="Shizuku artwork"
        >
      </div>

      <!-- DUEÑO -->
      <div id="dueños-container">Emilio Contreras</div>

    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesShizuku = [
      { src: "imagenes/shizuku/shizuku1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/shizuku/shizuku2.png", dueño: "María Pérez" },
      { src: "imagenes/shizuku/shizuku3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/shizuku/shizuku4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesShizuku[index].src;
          dueñoContainer.textContent = imagenesShizuku[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>

</body>
</html>
