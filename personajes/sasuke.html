<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Sasuke</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* 🟣 FONDO SASUKE */
    body {
      background: radial-gradient(
        circle at top,
        #2a1b4d 0%,
        #140c2b 45%,
        #06030f 100%
      );
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 600;
      text-align: center;
      font-size: 1.4rem;
      color: #e6e6ff;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/sasuke/sasuke.png"
        alt="Sasuke"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Sasuke Uchiha</h2>
          <p class="card__description">
            El último sobreviviente del clan Uchiha, Sasuke busca la fuerza necesaria
            para vengar a su familia. Un prodigio marcado por la oscuridad,
            dividido entre el odio, la redención y su eterno vínculo con Naruto.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">

      <!-- BOTONES -->
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <!-- IMÁGENES -->
      <div class="slides">
        <img
          id="sliderImage"
          src="imagenes/sasuke/sasuke1.png"
          class="fade show"
          alt="Sasuke artwork"
        >
      </div>

      <!-- DUEÑO -->
      <div id="dueños-container">Emilio Contreras</div>

    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesSasuke = [
      { src: "imagenes/sasuke/sasuke1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/sasuke/sasuke2.png", dueño: "María Pérez" },
      { src: "imagenes/sasuke/sasuke3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/sasuke/sasuke4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesSasuke[index].src;
          dueñoContainer.textContent = imagenesSasuke[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>

</body>
</html>
