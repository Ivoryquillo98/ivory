<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Killua</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider/carrusel -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ⚡ Fondo acorde a Killua (azules eléctricos + frío) */
    body{
      background:
        radial-gradient(circle at 25% 18%, rgba(90, 200, 255, 0.55) 0%, rgba(90, 200, 255, 0) 45%),
        radial-gradient(circle at 75% 22%, rgba(120, 120, 255, 0.45) 0%, rgba(120, 120, 255, 0) 50%),
        radial-gradient(circle at 50% 85%, rgba(200, 245, 255, 0.18) 0%, rgba(200, 245, 255, 0) 55%),
        linear-gradient(135deg, #08111f, #0c1f3b, #050b16);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;

      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 700;
      text-align: center;
      font-size: 1.4rem;
      padding: 0;
      background: transparent;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/killua/killua.png"
        alt="Killua Zoldyck"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Killua Zoldyck</h2>
          <p class="card__description">
            Asesino prodigio del famoso clan Zoldyck, Killua combina velocidad, inteligencia y carisma.
            Su evolución y amistad con Gon lo convierten en uno de los favoritos de Hunter x Hunter.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/killua/killua1.png"
          class="fade show"
          alt="Killua artwork"
        >
      </div>

      <div id="dueños-container">Emilio Contreras</div>
    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesKillua = [
      { src: "imagenes/killua/killua1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/killua/killua2.png", dueño: "María Pérez" },
      { src: "imagenes/killua/killua3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/killua/killua4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesKillua[index].src;
          dueñoContainer.textContent = imagenesKillua[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>
</body>
</html>
