<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Sanji</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider -->
  <link rel="stylesheet" href="css/carrusel.css">
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* Fondo inspirado en Sanji */
    body {
      background: 
        linear-gradient(to bottom, #F4C542, #F1B400),  /* Colores dorados y cálidos relacionados con la cocina */
        radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.8) 30%, transparent 90%);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 700;
      text-align: center;
      font-size: 1.4rem;
      color: #fff;
    }

    /* Estilo de la tarjeta */
    .card {
      display: grid;
      place-items: center;
      width: 80vw;
      max-width: 350px;
      height: 450px;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0.25rem 0.25rem 0.5rem rgba(0, 0, 0, 0.25);
      margin: 0 auto;
    }

    /* Texto del personaje */
    .card__title {
      font-family: "Montserrat", sans-serif;
      font-size: 2rem;
      color: #fff;
    }

    .card__description {
      font-family: "Lato", sans-serif;
      font-size: 1rem;
      color: #fff;
    }

    /* Estilo del slider */
    .slider a {
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }

    .slider a:hover {
      color: #F1B400;
    }

  </style>
</head>
<body>
  <div class="container">
    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/sanji/sanji.png"
        alt="Sanji background"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Sanji</h2>
          <p class="card__description">
            Cocinero del barco de los Sombrero de Paja, experto en combate con las piernas y apasionado por la gastronomía.  
            Sanji combina elegancia, fuerza y lealtad con un inconfundible toque caballeresco.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/sanji/sanji1.png"
          class="fade show"
          alt="Sanji artwork"
        >
      </div>

      <div id="dueños-container">Sebastián Torres</div>
    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesSanji = [
      { src: "imagenes/sanji/sanji1.png", dueño: "Sebastián Torres" },
      { src: "imagenes/sanji/sanji2.png", dueño: "María Fernández" },
      { src: "imagenes/sanji/sanji3.png", dueño: "Andrés Silva" },
      { src: "imagenes/sanji/sanji4.png", dueño: "Paula Rivera" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesSanji[index].src;
          dueñoContainer.textContent = imagenesSanji[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>
</body>
</html>
