<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Kurapika</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider/carrusel -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* 🔴 Fondo Kurapika: escarlata + oscuro elegante */
    body{
      background:
        radial-gradient(circle at 30% 20%, rgba(180, 30, 40, 0.45) 0%, rgba(180, 30, 40, 0) 45%),
        radial-gradient(circle at 70% 25%, rgba(120, 10, 20, 0.35) 0%, rgba(120, 10, 20, 0) 50%),
        radial-gradient(circle at 50% 85%, rgba(255, 80, 80, 0.18) 0%, rgba(255, 80, 80, 0) 55%),
        linear-gradient(135deg, #120506, #2a0b0f, #080203);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 700;
      text-align: center;
      font-size: 1.4rem;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/kurapika/kurapika.png"
        alt="Kurapika"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Kurapika</h2>
          <p class="card__description">
            Último superviviente del Clan Kurta, Kurapika dedica su vida a vengar a su pueblo
            y recuperar sus ojos escarlata. Inteligente, determinado y noble, es uno de los
            personajes más complejos de Hunter x Hunter.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/kurapika/kurapika1.png"
          class="fade show"
          alt="Kurapika artwork"
        >
      </div>

      <div id="dueños-container">Emilio Contreras</div>
    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesKurapika = [
      { src: "imagenes/kurapika/kurapika1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/kurapika/kurapika2.png", dueño: "María Pérez" },
      { src: "imagenes/kurapika/kurapika3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/kurapika/kurapika4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesKurapika[index].src;
          dueñoContainer.textContent = imagenesKurapika[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>
</body>
</html>
