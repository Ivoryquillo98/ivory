<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Chrollo</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider/carrusel -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ✅ Fondo acorde a Chrollo (oscuro, elegante, morado/negro) */
    body{
      background: radial-gradient(circle at 20% 10%, #2a1141 0%, #120718 35%, #06040a 100%);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;

      position: relative;
      z-index: 1;
    }

    /* ✅ MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 700;
      text-align: center;
      font-size: 1.4rem;
      padding: 0;
      background: transparent;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- Tarjeta del personaje -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/chrollo/chrollo.png"
        alt="Chrollo"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Chrollo Lucilfer</h2>
          <p class="card__description">
            Líder de la Brigada Fantasma, Chrollo es un estratega brillante y carismático.
            Su calma y frialdad lo convierten en uno de los personajes más intrigantes de Hunter x Hunter.
          </p>
        </div>
      </div>
    </article>

    <!-- Slider de imágenes -->
    <div class="slider">

      <!-- Botones -->
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <!-- Contenedor de imágenes -->
      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/chrollo/chrollo1.png"
          class="fade show"
          alt="Chrollo artwork"
        >
      </div>

      <!-- Dueño -->
      <div id="dueños-container">Emilio Contreras</div>
    </div>

  </div>

  <!-- JS del slider (igual al patrón que te funcionó) -->
  <script>
    const imagenesChrollo = [
      { src: "imagenes/chrollo/chrollo1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/chrollo/chrollo2.png", dueño: "María Pérez" },
      { src: "imagenes/chrollo/chrollo3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/chrollo/chrollo4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesChrollo[index].src;
          dueñoContainer.textContent = imagenesChrollo[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>
</body>
</html>
