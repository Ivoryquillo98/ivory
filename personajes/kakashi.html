<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Kakashi</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider/carrusel -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* 🔵 Fondo acorde a Kakashi (calma, niebla, chakra) */
    body{
      background:
        radial-gradient(circle at 30% 20%, rgba(120, 180, 255, 0.35) 0%, rgba(120, 180, 255, 0) 45%),
        radial-gradient(circle at 70% 35%, rgba(90, 140, 200, 0.25) 0%, rgba(90, 140, 200, 0) 50%),
        radial-gradient(circle at 50% 85%, rgba(200, 220, 255, 0.15) 0%, rgba(200, 220, 255, 0) 55%),
        linear-gradient(135deg, #0b1a2a, #1c2f44, #0a141f);
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;

      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 700;
      text-align: center;
      font-size: 1.4rem;
      padding: 0;
      background: transparent;
      color: #ffffff;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/kakashi/kakashi.png"
        alt="Kakashi Hatake"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Kakashi Hatake</h2>
          <p class="card__description">
            Conocido como el “Ninja Copia”, Kakashi es un shinobi de élite de la Aldea de la Hoja.
            Maestro del Sharingan y estratega brillante, destaca por su calma, inteligencia y liderazgo silencioso.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">

      <!-- BOTONES -->
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <!-- CONTENEDOR DE IMÁGENES -->
      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/kakashi/kakashi1.png"
          class="fade show"
          alt="Kakashi artwork"
        >
      </div>

      <!-- DUEÑO -->
      <div id="dueños-container">Emilio Contreras</div>

    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesKakashi = [
      { src: "imagenes/kakashi/kakashi1.png", dueño: "Emilio Contreras" },
      { src: "imagenes/kakashi/kakashi2.png", dueño: "María Pérez" },
      { src: "imagenes/kakashi/kakashi3.png", dueño: "Carlos Gómez" },
      { src: "imagenes/kakashi/kakashi4.png", dueño: "Lucía Torres" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesKakashi[index].src;
          dueñoContainer.textContent = imagenesKakashi[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>
</body>
</html>
