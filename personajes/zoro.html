<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Animada - Zoro</title>

  <!-- CSS del personaje -->
  <link rel="stylesheet" href="css/personajes.css">
  <!-- CSS del slider -->
  <link rel="stylesheet" href="css/carrusel.css">

  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    /* 🟢⚔️ FONDO ZORO — honor, acero y determinación */
    body {
      background: radial-gradient(
        circle at top,
        #1e5f3b 0%,
        #0e2f22 45%,
        #050d0a 100%
      );
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      gap: 2rem;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }

    /* 📱 MÓVIL: card arriba / carrusel abajo */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 1.25rem 1rem;
        gap: 1.25rem;
      }
    }

    /* NOMBRE DEL DUEÑO */
    #dueños-container {
      margin-top: 1rem;
      font-weight: 600;
      text-align: center;
      font-size: 1.4rem;
      color: #9bffb5; /* verde Zoro */
      text-shadow: 0 0 8px rgba(120, 255, 170, 0.45);
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TARJETA DEL PERSONAJE -->
    <article class="card">
      <img
        class="card__background"
        src="imagenes/zoro/zoro.png"
        alt="Zoro"
      />

      <div class="card__content flow">
        <div class="card__content--container flow">
          <h2 class="card__title">Zoro</h2>
          <p class="card__description">
            Espadachín de los Sombrero de Paja y maestro del estilo Santoryu.
            Fiel, decidido y con un sentido del honor inquebrantable,
            Zoro vive solo para superar sus límites y convertirse en el mejor espadachín del mundo.
          </p>
        </div>
      </div>
    </article>

    <!-- SLIDER -->
    <div class="slider">

      <!-- BOTONES -->
      <a href="#slide-1">1</a>
      <a href="#slide-2">2</a>
      <a href="#slide-3">3</a>
      <a href="#slide-4">4</a>

      <!-- CONTENEDOR IMÁGENES -->
      <div class="slides" id="slides">
        <img
          id="sliderImage"
          src="imagenes/zoro/zoro1.png"
          class="fade show"
          alt="Zoro artwork"
        >
      </div>

      <!-- DUEÑO -->
      <div id="dueños-container">Cristian Soto</div>

    </div>
  </div>

  <!-- JS -->
  <script>
    const imagenesZoro = [
      { src: "imagenes/zoro/zoro1.png", dueño: "Cristian Soto" },
      { src: "imagenes/zoro/zoro2.png", dueño: "Laura Hernández" },
      { src: "imagenes/zoro/zoro3.png", dueño: "Diego Martínez" },
      { src: "imagenes/zoro/zoro4.png", dueño: "Camila Rojas" }
    ];

    const sliderImage = document.getElementById("sliderImage");
    const dueñoContainer = document.getElementById("dueños-container");
    const buttons = document.querySelectorAll(".slider > a");

    buttons.forEach((btn, index) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        sliderImage.classList.remove("show");

        setTimeout(() => {
          sliderImage.src = imagenesZoro[index].src;
          dueñoContainer.textContent = imagenesZoro[index].dueño;
          sliderImage.classList.add("show");
        }, 150);
      });
    });
  </script>

</body>
</html>
